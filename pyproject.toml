[project]
name = "poe-craft-mcp"
version = "0.1.0"
description = "Local MCP server that ranks Path of Exile crafts by expected profit using live economy data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "httpx",
    "pydantic>=2",
    "jsonschema",
    "pyyaml",
    "keyring",
]

[project.urls]
Repository = "https://github.com/DaAwesomePwner/poe-craft-mcp"

[project.scripts]
poe-craft-mcp = "poe_craft_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poe_craft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
