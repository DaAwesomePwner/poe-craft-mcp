notes: >-
  Older guide (poeautocraft, 3.28 Mirage, March 2026): check it still holds in 3.30. What you
  make: a rare Medium Cluster Jewel with the enchant "Added Small Passive Skills grant: 15%
  increased Critical Strike Chance" and "Adds 4 Passive Skills", carrying both Overwhelming
  Malice and Pressure Points. Buy a white (normal) jewel with that enchant, 4 passives and item
  level 68-83 (Overwhelming Malice needs item level 68; at 84+ extra small-passive mods join the
  pool and both notables get rarer; the guide buys 75-83). Check it is not corrupted. Steps. (1)
  Use one Orb of Transmutation to make the white jewel magic. (2) Alteration and Augmentation
  cycle: use an Orb of Alteration; if the jewel has only a suffix (a small-passive line such as
  "+2 to All Attributes"), use an Orb of Augmentation to add a prefix; if it has only a prefix
  that is neither notable, alterate again. Stop as soon as Overwhelming Malice or Pressure
  Points appears; if it appears alone, do not augment. (3) Use one Regal Orb. If it adds the
  other notable, sell the pair. Otherwise sell the rare jewel (the anchor without its target
  partner) as it is. How the odds are derived (export weights at ilvl 75; ilvl 68-83 have the
  same pool): all mods weigh 22326, prefixes 11726, suffixes 10600; Overwhelming Malice 171,
  Pressure Points 457. Per cycle one of them appears with chance 0.05356 (mod_odds alt_aug:
  about 18.7 Alterations and 4.43 Augmentations per hit); it is Pressure Points 72.8% of the
  time and Overwhelming Malice 27.2%. The jewel has no suffix 26.3% of the time. The Regal then
  adds the missing notable with chance 0.00782 (Pressure Points there, Overwhelming Malice
  wanted; 0.00815 averaged over the suffix it may carry) or 0.0206 (Overwhelming Malice there,
  Pressure Points wanted; 0.0215 with a suffix), all mod_odds regal. Together 0.0116569 per
  attempt (the pair outcome, about 1 in 86); the other 0.9883431 is a rare jewel with one of the
  two and not the other, priced by its own search (it takes the cheaper of the two, so it is
  conservative). Pricing: every search here (base and both sales) asks for instant-buyout
  listings only (trade status "securable"); both sale searches take rare jewels with the same
  enchant, passive count and item-level range as the base, not corrupted. The pair is rare: most
  of the value is the one-notable sale. Not modelled: the guide scours a miss and starts again
  (here a miss is sold) and uses an Exalted Orb when the Regal added a suffix and a prefix slot
  is still open. Minutes (estimate, not from the guide): about 19 Alterations at 3 s each (1
  min), the Regal, plus buying the base and listing (3 min). Verify in game: notable names and
  item levels, the enchant and passive count on the searches, and that the sale searches show
  jewels like yours.
