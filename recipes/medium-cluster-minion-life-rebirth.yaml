notes: >-
  Older guide (poeautocraft, 3.28 Mirage, March 2026): check it still holds in 3.30. What you
  make: a rare Medium Cluster Jewel with the enchant "Added Small Passive Skills grant: Minions
  have 12% increased maximum Life" and "Adds 4 Passive Skills", carrying both Life from Death
  and Blessed Rebirth. Buy a white (normal) jewel with that enchant, 4 passives and item level
  68-83 (Blessed Rebirth needs item level 68; at 84+ extra small-passive mods join the pool and
  both notables get rarer; the guide buys 75-83). Check it is not corrupted.
  Steps. (1) Use one Orb of Transmutation to make the white jewel magic. (2) Alteration and
  Augmentation cycle: use an Orb of Alteration; if the jewel has only a suffix (a small-passive
  line such as "+3% to Chaos Resistance"), use an Orb of Augmentation to add a prefix; if it has
  only a prefix that is neither notable, alterate again. Stop as soon as Life from Death or
  Blessed Rebirth appears; if it appears alone, do not augment. (3) Use one Regal Orb. If it
  adds the other notable, sell the pair. Otherwise sell the rare one-notable jewel as it is.
  How the odds are derived (export weights at ilvl 75; ilvl 68-83 have the same pool): all mods
  weigh 22499, prefixes 11899, suffixes 10600; Life from Death 716, Blessed Rebirth 269. Per
  cycle one of them appears with chance 0.08278 (mod_odds alt_aug: about 12.1 Alterations and
  2.85 Augmentations per hit); it is Life from Death 72.7% of the time, Blessed Rebirth 27.3%.
  The jewel has no suffix 26.4% of the time. The Regal then adds the missing notable with chance
  0.01235 (Life from Death there, Blessed Rebirth wanted; 0.01287 averaged over the suffix it
  may carry) or 0.0322 (Blessed Rebirth there; 0.0335 with a suffix), all mod_odds regal.
  Together 0.0183218 per attempt (the pair outcome, about 1 in 55); the other 0.9816782 is a
  jewel with one of the two, priced by its own search (it takes the cheaper of the two, so it is
  conservative). Most of the value is the one-notable sale. Not modelled: the guide scours a
  miss and starts again (here a miss is sold) and uses an Exalted Orb when the Regal added a
  suffix and a prefix slot is still open. Minutes (estimate, not from the guide): about 12
  Alterations at 3 s each (under 1 min), the Regal, plus buying the base and listing (3 min).
  Verify in game: notable names and item levels, the enchant and passive count on the searches,
  and that the sale searches show jewels like yours.
