notes: >-
  What you make: a rare Medium Cluster Jewel whose enchant reads "Added Small Passive Skills
  grant: 12% increased Chaos Damage over Time", with "Adds 5 Passive Skills", carrying the
  notable Wicked Pall plus one of Flow of Life, Brush with Death or Student of Decay. These
  three pairs are the Wicked Pall pairs in the guides (poeautocraft for 3.28 and 3.29, both
  pre-3.30; Exile's Foundry for 3.30 lists Flow of Life + Wicked Pall). Buy a white (normal)
  jewel with that enchant, 5 passives and item level 68-83 (the Flow of Life and Brush with
  Death notables need item level 68; at 84+ extra small-passive mods join the pool and every
  notable gets rarer, so 75-83 is what the guides buy). Check it is not corrupted. Steps. (1)
  Use one Orb of Transmutation to make the white jewel magic. (2) Alteration and Augmentation
  cycle: use an Orb of Alteration; if the jewel now has only a suffix (a small-passive line such
  as "+2% to all Elemental Resistances"), use an Orb of Augmentation to add a prefix; if it has
  only a prefix that is not Wicked Pall, alterate again (an Augmentation would only add a
  suffix). Stop as soon as "1 Added Passive Skill is Wicked Pall" appears; if it appears alone,
  do not augment. (3) Use one Regal Orb. If it adds Flow of Life, Brush with Death or Student of
  Decay, sell the pair. Otherwise you have a rare Wicked Pall jewel: sell it as it is. How the
  odds are derived (export weights at ilvl 75; ilvl 68-83 have the same pool): all mods weigh
  22500, prefixes 11900, suffixes 10600; Wicked Pall 348; the three partners 130 (Flow of Life)
  + 130 (Brush with Death) + 348 (Student of Decay) = 608. Per cycle Wicked Pall appears with
  chance 0.02924 (mod_odds alt_aug: about 34.2 Alterations and 8.05 Augmentations per Wicked
  Pall). It comes alone (no suffix) 26.4% of the time; then a Regal hits a partner with chance
  0.02745 (mod_odds regal, existing Wicked Pall). Otherwise the jewel also has a suffix, drawn
  in proportion to suffix weight; the Regal's chance averaged over those suffixes is 0.02859
  (mod_odds regal with each suffix, weighted). Together 0.264 x 0.02745 + 0.736 x 0.02859 =
  0.0282887 per attempt (the pair outcome); the other 0.9717113 is a Wicked Pall jewel without a
  partner, priced by its own search. Not modelled: the guides scour a miss and start again (here
  a miss is sold), and when the Regal added a suffix (a prefix slot is still open) they use an
  Exalted Orb for a second notable (cheap upside the numbers leave out). Minutes (estimate, not
  from a guide): about 34 Alterations at 3 s each (2 min), the Regal, plus buying the base and
  listing (3 min). Verify in game: the notable names and item levels, that the enchant and
  passive count match the searches, and that the two sale searches show jewels you would really
  sell against.
