notes: >-
  Older guide (PoE Vault, July 2024, written for Sentinel): check that it still works in 3.30
  before relying on it. What you make: a rare Convoking Wand with two prefixes, +1 to Level of
  all Spell Skill Gems (mod GlobalSpellGemsLevel1) and +1 to Level of all Minion Skill Gems (mod
  MinionGemLevel1h1). Only the minion wands (Calling, Convening and Convoking Wand) can roll the
  minion prefix; this recipe uses Convoking Wand, the highest-level one, as the guide does (the
  odds and searches here are for Convoking only). Buy a white (normal) Convoking Wand of item
  level 84+ (84 unlocks the top minion damage tier, a bonus if it appears).
  Steps. (1) A Chaotic Resonator rerolls a RARE item, like a Chaos Orb, so first use one Orb of
  Alchemy to make the white wand rare (or buy a rare one instead). (2) Put Corroded, Jagged, Shuddering and Metallic Fossils into a Prime Chaotic Resonator
  (four sockets) and apply it to the wand. Each use rerolls the whole wand. Repeat with a new
  resonator and four new fossils until both gem-level prefixes are on the wand; then sell it
  (the guide goes on to bench-craft a suffix such as the spell trigger; that finishing is not
  modelled, and the sale search does not require it).
  How the odds are derived: mod_odds with the four fossils on Convoking Wand at ilvl 84 gives
  P(spell level) = 0.1102, P(minion level) = 0.3211 and P(at least one) = 0.3497 (Monte Carlo,
  20000 samples, same seed). Both together = 0.1102 + 0.3211 - 0.3497 = 0.0816 per attempt
  (about 12.3 attempts), recorded as a user number because mod_odds reports "at least one of the
  targets", not "all of them". The guide's own estimate is "around 10-12 tries", which agrees.
  Minutes (estimate, not from the guide): about 12 attempts at 40 s each to socket four fossils
  and apply the resonator (8 min) plus buying the base, the Alchemy and listing (4 min). Fossils come from
  Delve. Verify in game: the fossil combination is still allowed together, the two mods appear
  as prefixes, and the sale search shows wands like yours (suffixes and minion damage change the
  price a lot).
