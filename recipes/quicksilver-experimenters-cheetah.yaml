notes: >-
  What you make: a magic Quicksilver Flask with the prefix Experimenter's (36-40% increased
  Duration, needs item level 84) and the suffix of the Cheetah (12-14% increased Movement Speed
  during Effect, needs item level 85). Buy a white Quicksilver Flask of item level 85+ (hover
  the item or check "Item Level" on trade; "Requires Level" is something else).
  Steps. (1) Use one Orb of Transmutation to make it magic. (2) Use Orbs of Alteration
  repeatedly; stop as soon as "of the Cheetah" appears. Per the 3.30 export weights each
  alteration hits it with chance 0.01391 (mod_odds, alt, ilvl 85), about 72 alterations on
  average. (3) If the flask has only the Cheetah suffix, use one Orb of Augmentation to add a
  prefix. If the alteration already gave a prefix, keep the flask as it is. Then sell it.
  How the odds are derived (export weights at ilvl 85, no guess): all mods weigh 85050,
  suffixes 62250, prefixes 22800; Cheetah weighs 1000 and Experimenter's 600. Alteration gives
  1 or 2 affixes (50/50, the tool's assumption). Chance of a lone Cheetah = 0.5 x 1000/85050 =
  0.005879; chance of Cheetah plus a prefix = 0.5 x (1000/85050 + 22800/85050 x 1000/62250) =
  0.008032; together 0.013911 (= the mod_odds value). So when you stop, the Cheetah is alone
  0.005879/0.013911 = 0.4226 of the time (that is the Augmentation quantity). In both cases
  the prefix is drawn in proportion to prefix weight, so it is Experimenter's with chance
  600/22800 = 0.0263158 (1 in 38); otherwise (0.9736842) you sell a Cheetah flask with another
  prefix, priced by the salvage search. The guide's own route keeps alt+aug spamming until both
  mods are on the flask; by the same weights that is 0.000423 per alteration (about 2366
  alterations plus 0.0094 Augmentations per alteration) and is not modelled here.
  Minutes (estimate, not from the guide): about 72 alterations at 2-3 s each (3 min) plus
  buying the base and listing the flask (3 min). Price quality and enchants separately; the
  searches ignore them. Verify in game: the mod names/tiers on the flask, the item level, and
  that the sale and salvage searches show flasks you would really sell against.
