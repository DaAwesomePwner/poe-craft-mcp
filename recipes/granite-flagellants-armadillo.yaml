notes: >-
  What you make: a magic Granite Flask with the prefix Flagellant's (Gain 3 Charges when you are
  Hit by an Enemy, needs item level 80) and the suffix of the Armadillo (56-60% increased Armour
  during Effect, needs item level 84). Buy a white, uncorrupted Granite Flask of item level exactly
  84 (an 85 adds of the Cheetah to the suffix pool and changes the odds; check "Item
  Level", not "Requires Level").
  Steps. (1) Use one Orb of Transmutation to make it magic. (2) Use Orbs of Alteration
  repeatedly; stop as soon as "of the Armadillo" appears. Per the 3.30 export weights each
  alteration hits it with chance 0.01058 (mod_odds, alt, ilvl 84), about 94.5 alterations on
  average. (3) If the flask has only the Armadillo suffix, use one Orb of Augmentation to add a
  prefix. If the alteration already gave a prefix, keep the flask as it is. Then sell it.
  How the odds are derived (export weights at ilvl 84, no guess): all mods weigh 84050,
  suffixes 61250, prefixes 22800; Armadillo weighs 750 and Flagellant's 600. Alteration gives 1
  or 2 affixes (50/50, the tool's assumption). Chance of a lone Armadillo = 0.5 x 750/84050 =
  0.004462; chance of Armadillo plus a prefix = 0.5 x (750/84050 + 22800/84050 x 750/61250) =
  0.006122; together 0.010584 (= the mod_odds value). So when you stop, the Armadillo is alone
  0.004462/0.010584 = 0.4215 of the time (that is the Augmentation quantity). In both cases the
  prefix is drawn in proportion to prefix weight, so it is Flagellant's with chance 600/22800 =
  0.0263158 (1 in 38); otherwise (0.9736842) you sell an Armadillo flask with another prefix,
  priced by its own sale search (that flask, one non-Flagellant prefix, not corrupted). The guide's own route keeps alt+aug spamming until both mods are
  on the flask; by the same weights that is 0.000322 per alteration (about 3103 alterations plus
  0.0080 Augmentations per alteration) and is not modelled here.
  Minutes (estimate, not from the guide): about 95 alterations at 2-3 s each (4 min) plus buying
  the base and listing the flask (3 min). Price quality and enchants separately; the searches
  ignore them. Verify in game: the mod names/tiers on the flask, the item level, and that the
  two sale searches show flasks you would really sell against.
