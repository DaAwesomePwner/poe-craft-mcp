notes: >-
  What you make: a rare Large Cluster Jewel with the enchant "Added Small Passive Skills grant:
  10% increased Spell Damage" and "Adds 8 Passive Skills", carrying Mage Hunter plus Conjured
  Wall or Arcane Heroism. The guide (poeautocraft / JJ546, 3.30, November 2026) goes further:
  Alteration-Augmentation-Regal-Exalt to a three-notable jewel (its template's finished jewels
  are Mage Hunter + Conjured Wall or Arcane Heroism + one of the suffix notables Essence Rush,
  Thaumophage or Sap Psyche). The Exalted Orb step is not modelled here; this recipe stops at
  the two-notable jewel after one Regal, which is the guide's half-way point. Buy a white
  (normal) jewel with that enchant, 8 passives and item level 75-83, as the guide does (Mage
  Hunter needs item level 68; at 84+ extra small-passive mods join the pool and the notables get
  rarer). Check it is not corrupted. Steps. (1) Use one Orb of Transmutation to make the white
  jewel magic. (2) Alteration and Augmentation cycle: use an Orb of Alteration; if the jewel has
  only a suffix, use an Orb of Augmentation to add a prefix; if it has only a prefix that is not
  Mage Hunter, alterate again. Stop as soon as "1 Added Passive Skill is Mage Hunter" appears;
  if it appears alone, do not augment. (The guide also stops on Conjured Wall, Arcane Heroism or
  a suffix notable; this recipe stops on Mage Hunter only, the notable all of the guide's
  finished jewels share.) (3) Use one Regal Orb. If it adds Conjured Wall or Arcane Heroism,
  sell the pair (or, beyond this recipe, exalt for a suffix notable). Otherwise sell the rare
  Mage Hunter jewel without a target partner. How the odds are derived (export weights at ilvl
  75; ilvl 75-83 have the same pool): all mods weigh 22499, prefixes 10118, suffixes 12381; Mage
  Hunter 281, Conjured Wall 750, Arcane Heroism 281. Per cycle Mage Hunter appears with chance
  0.02777 (mod_odds alt_aug: about 36.0 Alterations and 9.91 Augmentations per Mage Hunter). It
  comes alone 22.5% of the time; then a Regal adds Conjured Wall or Arcane Heroism with chance
  0.0464 (mod_odds regal). Otherwise the jewel also has a suffix (drawn in proportion to suffix
  weight, which can be a suffix notable); averaged over those suffixes the Regal's chance is
  0.0486. Together 0.0481352 per attempt (about 1 in 21); the other 0.9518648 is a rare Mage
  Hunter jewel without either target partner, priced by its own search (a Mage Hunter +
  suffix-notable jewel is worth more than that search says, so the miss value is conservative).
  Pricing: every search here (base and both sales) asks for instant-buyout listings only (trade
  status "securable"); both sale searches take rare jewels with the same enchant, passive count
  and item-level range as the base, not corrupted. Not modelled: the Exalted Orb finish, and
  scouring a miss to start again. Minutes (estimate, not from the guide): about 36 Alterations
  at 3 s each (2 min), the Regal, plus buying the base and listing (3 min). Verify in game:
  notable names, item levels and which are prefixes, the enchant and passive count on the
  searches, and that the sale searches show jewels you would really sell against.
